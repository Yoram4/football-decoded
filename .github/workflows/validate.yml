name: Validate deck

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate chapters
        run: node tests/check_chapter.js src/chapters/ch*.js src/he/chapters/ch*.js
      - name: Build bilingual index
        run: python build.py --lang both
      - name: Check generated index is committed
        run: git diff --exit-code -- index.html